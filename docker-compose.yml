# Local dev database only. Credentials are throwaway test values.
services:
  db:
    build: ./db/docker
    container_name: utsav_pg
    environment:
      POSTGRES_USER: tuner
      POSTGRES_PASSWORD: tuner
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    # pg_stat_statements must be preloaded to record query timings.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c shared_buffers=512MB
      -c work_mem=32MB
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
